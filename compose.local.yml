# 로컬 전용 override이며 운영 배포는 compose.yml만 사용한다.
# 앱 이미지는 base의 IMAGE_TAG 치환을 쓰지 않고 저장소 Dockerfile로 직접 빌드한다.
services:
  # s3mock is a local/integration substitute only. Production compose.yml has no
  # object-storage service and always uses the managed object-store tuple.
  object-storage:
    image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    # 이미지 기본 사용자(uid 1000)는 root 소유로 새로 생기는 마운트 지점 /data에 쓰지 못해
    # PutObject가 500으로 실패한다. 로컬·CI 전용 substitute라 root로 실행한다.
    user: '0:0'
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${SUBMISSION_FILE_S3_BUCKET:?SUBMISSION_FILE_S3_BUCKET is required}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
      # smoke 점검이 사이드카 없이 컨테이너 내부에서 버킷 이름을 읽기 위한 값이다.
      SUBMISSION_FILE_S3_BUCKET: ${SUBMISSION_FILE_S3_BUCKET:?SUBMISSION_FILE_S3_BUCKET is required}
    volumes:
      - object_storage_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:9090/favicon.ico',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    image: !reset null
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      object-storage:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:3000/']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  nginx:
    depends_on:
      frontend:
        condition: service_healthy
    # 로컬 브라우저 대면 주소를 dev GitHub OAuth App에 이미 등록된 콜백 origin과 맞춘다.
    # 운영은 host nginx가 공인 443을 받아 내부 127.0.0.1:8081로 넘기므로 콜백에 8081이 등장하지 않는다.
    # 로컬에는 host nginx가 없어 Compose ingress가 곧 브라우저 대면 주소가 되므로 3000으로 노출한다.
    # 기존 프론트 dev 서버가 3000을 쓰고 있으면 LOCAL_INGRESS_PORT로 임시 변경할 수 있으나,
    # 그 경우 OAuth 콜백 origin이 어긋나 로그인은 성립하지 않는다.
    ports: !override
      - '127.0.0.1:${LOCAL_INGRESS_PORT:-3000}:80'
    volumes: !override
      - ./deploy/nginx-local:/etc/nginx/conf.d:ro

volumes:
  object_storage_data:
