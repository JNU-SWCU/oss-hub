# 로컬 전용 override이며 운영 배포는 compose.yml만 사용한다.
# 앱 이미지는 base의 IMAGE_TAG 치환을 쓰지 않고 저장소 Dockerfile로 직접 빌드한다.
services:
  # MinIO is a local/integration substitute only. Production compose.yml has no
  # MinIO service and always uses the managed object-store tuple.
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${ROLLBACK_MINIO_ACCESS_KEY_ID:?ROLLBACK_MINIO_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${ROLLBACK_MINIO_SECRET_ACCESS_KEY:?ROLLBACK_MINIO_SECRET_ACCESS_KEY is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '--fail',
          '--silent',
          'http://localhost:9000/minio/health/ready',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-bucket:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z@sha256:fb8f773eac8ef9d6da0486d5dec2f42f219358bcb8de579d1623d518c9ebd4cc
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${ROLLBACK_MINIO_ACCESS_KEY_ID:?ROLLBACK_MINIO_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${ROLLBACK_MINIO_SECRET_ACCESS_KEY:?ROLLBACK_MINIO_SECRET_ACCESS_KEY is required}
      ROLLBACK_MINIO_BUCKET: ${ROLLBACK_MINIO_BUCKET:?ROLLBACK_MINIO_BUCKET is required}
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - >-
        rm -f /tmp/bucket-ready &&
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null &&
        mc mb --ignore-existing "local/$${ROLLBACK_MINIO_BUCKET}" >/dev/null &&
        mc anonymous set none "local/$${ROLLBACK_MINIO_BUCKET}" >/dev/null &&
        touch /tmp/bucket-ready &&
        exec sleep infinity
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/bucket-ready']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    image: !reset null
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      minio-bucket:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:3000/']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  nginx:
    depends_on:
      frontend:
        condition: service_healthy
    # 로컬 브라우저 대면 주소를 dev GitHub OAuth App에 이미 등록된 콜백 origin과 맞춘다.
    # 운영은 host nginx가 공인 443을 받아 내부 127.0.0.1:8081로 넘기므로 콜백에 8081이 등장하지 않는다.
    # 로컬에는 host nginx가 없어 Compose ingress가 곧 브라우저 대면 주소가 되므로 3000으로 노출한다.
    # 기존 프론트 dev 서버가 3000을 쓰고 있으면 LOCAL_INGRESS_PORT로 임시 변경할 수 있으나,
    # 그 경우 OAuth 콜백 origin이 어긋나 로그인은 성립하지 않는다.
    ports: !override
      - '127.0.0.1:${LOCAL_INGRESS_PORT:-3000}:80'
    volumes: !override
      - ./deploy/nginx-local:/etc/nginx/conf.d:ro

volumes:
  minio_data:
