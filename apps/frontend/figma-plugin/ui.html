<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font:
          13px/1.5 -apple-system,
          sans-serif;
        margin: 0;
        padding: 16px;
        color: #444;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
      }
      input[type='url'] {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font: inherit;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      button {
        height: 36px;
        padding: 0 16px;
        border-radius: 8px;
        border: 1px solid #ddd;
        background: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary {
        background: #003399;
        color: #fff;
        border-color: #003399;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #log {
        margin-top: 12px;
        height: 150px;
        overflow: auto;
        background: #f7f7f7;
        border-radius: 8px;
        padding: 8px;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <label for="url">tokens.json 주소</label>
    <input
      id="url"
      type="url"
      value="https://raw.githubusercontent.com/JNU-SWCU/oss-hub/main/docs/design-tokens/tokens.json"
    />
    <div class="row">
      <label
        ><input id="variables" type="checkbox" checked /> 변수·텍스트
        스타일</label
      >
      <label><input id="components" type="checkbox" checked /> 컴포넌트</label>
    </div>
    <div class="row">
      <button id="run" class="primary">만들기</button>
      <button id="close">닫기</button>
    </div>
    <div id="log">
      준비됨. 실행 전에 이 파일이 비어 있거나, 다시 만들어도 되는 파일인지
      확인한다.
    </div>
    <script>
      const log = document.getElementById('log');
      const run = document.getElementById('run');
      run.onclick = () => {
        run.disabled = true;
        log.textContent = '';
        parent.postMessage(
          {
            pluginMessage: {
              type: 'run',
              url: document.getElementById('url').value.trim(),
              steps: {
                variables: document.getElementById('variables').checked,
                components: document.getElementById('components').checked,
              },
            },
          },
          '*',
        );
      };
      document.getElementById('close').onclick = () =>
        parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;
        if (message.type === 'log') {
          log.textContent += message.text + '\n';
          log.scrollTop = log.scrollHeight;
        }
        if (message.type === 'done') run.disabled = false;
      };
    </script>
  </body>
</html>
