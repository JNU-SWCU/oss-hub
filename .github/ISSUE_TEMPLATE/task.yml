name: 작업
description: 기능 추가·개선·정리 작업의 범위와 완료 조건을 정한다
labels: [ticket]
body:
  - type: textarea
    id: background
    attributes:
      label: 배경·목표
      description: 왜 필요한지, 끝나면 무엇이 달라지는지
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위
      description: 이번에 할 것과 하지 않을 것
      value: |
        할 것
        -

        하지 않을 것
        -
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 확인할 수 있는 조건만 적는다
      value: |
        - [ ]
    validations:
      required: true
