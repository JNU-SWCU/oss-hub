name: deploy

# 공개 GitHub Release 발행(published)을 production 배포 트리거로 사용한다.
# 이 워크플로는 전용 Jenkins API token으로 인증하고 파라미터 없는 원격 빌드 POST만 한다(얇은 트리거).
# 실제 배포·검증·실패 알림은 Jenkins가 수행한다 (docs/decisions/ADR-002-CI-CD-파이프라인.md).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  trigger:
    name: trigger-jenkins-deploy
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Jenkins 원격 빌드 트리거
        env:
          # 실제 값은 GitHub repo secret에만 둔다(공인 IP·token을 저장소/로그에 남기지 않는다).
          JENKINS_DEPLOY_URL: ${{ secrets.JENKINS_DEPLOY_URL }}
          JENKINS_USER: oss-hub-deployer
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          set -euo pipefail
          # secret 미설정 시 URL/토큰이 비어 모호한 curl 오류가 나지 않게 먼저 막는다.
          : "${JENKINS_DEPLOY_URL:?JENKINS_DEPLOY_URL secret is required}"
          : "${JENKINS_USER:?JENKINS_USER is required}"
          : "${JENKINS_API_TOKEN:?JENKINS_API_TOKEN secret is required}"
          case "${JENKINS_DEPLOY_URL}" in
            https://*) ;;
            *)
              echo '::error::JENKINS_DEPLOY_URL must use https'
              exit 1
              ;;
          esac
          # Jenkins API token 인증 요청은 CSRF crumb 없이 허용되며 nginx는 이 exact POST 경로만 공개한다.
          curl --fail --silent --show-error \
            --basic --user "${JENKINS_USER}:${JENKINS_API_TOKEN}" \
            --request POST \
            "${JENKINS_DEPLOY_URL}/job/oss-hub-release-cd/build"
