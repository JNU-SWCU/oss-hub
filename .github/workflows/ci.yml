name: ci

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: ci
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 변경 감지
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
              - '.design-sync/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'compose.dev.yml'
              - '.github/workflows/**'
            backend:
              - 'apps/backend/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'compose.dev.yml'
              - '.github/workflows/**'
            nginx:
              - 'deploy/nginx/**'
              - 'deploy/host-nginx/**'
              - 'deploy/checks/**'
              - '.github/workflows/**'
            jenkins:
              - 'Jenkinsfile'
              - 'compose.yml'
              - 'apps/*/Dockerfile'
              - '.dockerignore'
              - '.env.example'
              - 'deploy/jenkins/**'
              - 'deploy/nginx/**'
              - 'deploy/host-nginx/**'
              - '.github/workflows/**'
            shell_scripts:
              - 'dev.sh'
              - 'deploy/**/*.sh'
              - 'apps/backend/prisma/**/*.sh'
              - 'apps/backend/test/**/*.sh'
              - '.github/**/*.sh'
              - '.githooks/**'
              - '.github/workflows/**'
            node_scripts:
              - 'deploy/**/*.mjs'
              - '.design-sync/**/*.mjs'
              - '.github/workflows/**'
            rails:
              - 'apps/backend/**'
              - 'apps/frontend/**'
              - 'eslint.shared.mjs'
              - 'eslint-rules/**'
              - 'knip.json'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'

      - name: 실행 스코프 결정
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          FRONTEND: ${{ steps.changes.outputs.frontend }}
          BACKEND: ${{ steps.changes.outputs.backend }}
          NGINX: ${{ steps.changes.outputs.nginx }}
          JENKINS: ${{ steps.changes.outputs.jenkins }}
          SHELL_SCRIPTS: ${{ steps.changes.outputs.shell_scripts }}
          NODE_SCRIPTS: ${{ steps.changes.outputs.node_scripts }}
          RAILS: ${{ steps.changes.outputs.rails }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            FRONTEND=true
            BACKEND=true
            NGINX=true
            JENKINS=true
            SHELL_SCRIPTS=true
            NODE_SCRIPTS=true
            RAILS=true
          fi
          if [ "$RAILS" = true ]; then
            FRONTEND=true
            BACKEND=true
          fi
          {
            echo "frontend=$FRONTEND"
            echo "backend=$BACKEND"
            echo "nginx=$NGINX"
            echo "jenkins=$JENKINS"
            echo "shell_scripts=$SHELL_SCRIPTS"
            echo "node_scripts=$NODE_SCRIPTS"
            echo "rails=$RAILS"
          } >> "$GITHUB_OUTPUT"

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 릴리스 배포 스코프 판정 단위테스트
        run: node --test deploy/frontend/select-release-deploy-scope.test.mjs

      - name: pnpm 설정
        if: ${{ steps.scope.outputs.frontend == 'true' || steps.scope.outputs.backend == 'true' || steps.scope.outputs.jenkins == 'true' }}
        uses: pnpm/action-setup@v4

      - name: pnpm 캐시 설정
        if: ${{ steps.scope.outputs.frontend == 'true' || steps.scope.outputs.backend == 'true' || steps.scope.outputs.jenkins == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: shell script 문법 검사
        if: ${{ steps.scope.outputs.shell_scripts == 'true' }}
        run: |
          bash -n dev.sh
          find deploy apps/backend/prisma apps/backend/test .github -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          for hook in .githooks/*; do
            bash -n "$hook"
          done

      - name: 호스트 lane DATABASE_URL 가드 회귀 테스트
        if: ${{ steps.scope.outputs.shell_scripts == 'true' }}
        run: bash apps/backend/prisma/check-host-db-url.test.sh

      - name: pre-commit 훅 파일명 전달 회귀 테스트
        if: ${{ steps.scope.outputs.shell_scripts == 'true' }}
        run: bash .githooks/pre-commit.test.sh

      - name: Node script 문법 검사
        if: ${{ steps.scope.outputs.node_scripts == 'true' }}
        run: |
          find deploy .design-sync -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: nginx ingress 계약 검사
        if: ${{ steps.scope.outputs.nginx == 'true' }}
        run: |
          docker run --rm \
            --add-host backend:127.0.0.1 \
            --volume "$PWD/deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10 nginx -t
          bash deploy/checks/check-host-nginx.test.sh
          bash deploy/checks/check-host-nginx.sh
          bash deploy/checks/check-submission-upload-route.test.sh
          bash deploy/checks/check-submission-upload-route.sh

      - name: Jenkins 배포 계약 회귀 테스트
        if: ${{ steps.scope.outputs.jenkins == 'true' }}
        run: |
          docker compose --env-file /dev/null -f compose.yml config --no-interpolate --quiet
          node --test deploy/jenkins/release-behavior.test.mjs
          node --test deploy/jenkins/validate-production-env.test.mjs
          node --test deploy/jenkins/validate-github-app-credentials.test.mjs
          ! grep -rlE 'oss-hub-release-c[d]|JENKINS[_]' .github/workflows
          bash deploy/jenkins/prune-deploy-backups.test.sh

      - name: 의존성 설치
        if: ${{ steps.scope.outputs.frontend == 'true' || steps.scope.outputs.backend == 'true' || steps.scope.outputs.jenkins == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Knip 구조 검사
        if: ${{ steps.scope.outputs.rails == 'true' }}
        run: pnpm lint:structure

      - name: prettier 포맷 검사
        if: ${{ steps.scope.outputs.frontend == 'true' || steps.scope.outputs.backend == 'true' }}
        run: pnpm format:check

      - name: design sync contract
        if: ${{ steps.scope.outputs.frontend == 'true' }}
        run: node --test .design-sync/contract.test.mjs

      - name: frontend lint
        if: ${{ steps.scope.outputs.frontend == 'true' }}
        run: pnpm --filter frontend lint

      - name: frontend typecheck
        if: ${{ steps.scope.outputs.frontend == 'true' }}
        run: pnpm --filter frontend typecheck

      - name: frontend test
        if: ${{ steps.scope.outputs.frontend == 'true' }}
        run: pnpm --filter frontend test

      - name: frontend build
        if: ${{ steps.scope.outputs.frontend == 'true' }}
        env:
          BACKEND_ORIGIN: https://backend.example.test
        run: pnpm --filter frontend build

      - name: backend lint
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: pnpm --filter backend lint

      - name: backend typecheck
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: pnpm --filter backend typecheck

      - name: backend unit test
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: pnpm --filter backend test:unit

      - name: backend integration runner contract
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: bash apps/backend/test/run-integration.test.sh

      - name: backend integration test
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: pnpm --filter backend test:integration

      - name: backend build
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: pnpm --filter backend build

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pnpm 설정
        uses: pnpm/action-setup@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치 (ignore-scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Conventional Commits 검사
        run: pnpm exec commitlint --config commitlint.config.cjs --from "origin/${GITHUB_BASE_REF}" --to HEAD --verbose

  public-safe:
    name: public-safe
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: public-safe regex 회귀 테스트
        run: bash .github/check-public-safe.test.sh

      - name: gitleaks 시크릿 스캔 (이 PR의 신규 커밋만)
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --log-opts="origin/${GITHUB_BASE_REF}..HEAD" .

      - name: public-safe regex 스캔 (deny-list)
        env:
          PR_TEXT: |
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}
        run: bash .github/check-public-safe.sh "origin/${GITHUB_BASE_REF}"

  public-safe-issue:
    name: public-safe-issue
    if: github.event_name == 'issues' || github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: public-safe regex 스캔 (Issue 본문·댓글, deny-list)
        env:
          ISSUE_TEXT: |
            ${{ github.event.issue.title }}
            ${{ github.event.issue.body }}
            ${{ github.event.comment.body }}
        run: bash .github/check-public-safe.sh --text-only

  frontend-release-deploy:
    name: frontend-release-deploy
    if: ${{ github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    concurrency:
      group: frontend-production
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: 릴리스 입력 검증
        id: release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "full SemVer tag가 아니다: $TAG" >&2
            exit 1
          fi
          sha="$(git rev-list -n 1 "refs/tags/$TAG")"
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "release SHA가 main 이력에 없다: $sha" >&2
            exit 1
          fi
          echo "RELEASE_INPUT tag=$TAG sha=$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: 배포 대상 판정
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: node deploy/frontend/select-release-deploy-scope.mjs >> "$GITHUB_OUTPUT"

      - name: frontend 무변경 no-op
        if: ${{ steps.scope.outputs.frontend != 'true' }}
        run: echo "frontend 배포 산출물에 변경이 없어 Vercel 배포를 건너뛴다."

      - name: Vercel production 배포
        if: ${{ steps.scope.outputs.frontend == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "$name 시크릿이 없어 배포를 진행할 수 없다" >&2
              exit 1
            fi
          done
          npx --yes vercel@58 deploy --prod --yes --token "$VERCEL_TOKEN"
          echo "RELEASE_DEPLOY target=vercel sha=$SHA"
