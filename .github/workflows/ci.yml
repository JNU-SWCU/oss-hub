name: ci

# paths 필터를 사용하지 않아 모든 PR에서 required check이 생성되어 교착을 방지한다.
# issues·issue_comment는 Issue 본문·댓글 public-safe 스캔 전용 트리거다
# (PR title/body만 검사하던 사각지대 — #56 실증, docs/rules/security.md).
# push(main)는 required check 우회 병합 등으로 main 자체가 red가 돼도
# 병합 시점까지 아무 신호가 없던 사각지대를 잡는다 (PR #586 postmortem, ci job만 재실행).
# release(published)는 배포 인가 이벤트다 — frontend 배포 주체를 CI 안으로 들인다
# (ADR-002, Issue #1172). ci·public-safe job은 이 이벤트에서 돌지 않는다.
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

# dorny/paths-filter가 PR 변경 파일을 조회할 수 있도록 최소 권한을 명시한다.
permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: ci
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 변경된 앱만 검사해 CI 실행 시간과 과금을 절감한다.
      # base는 pull_request 이벤트에서는 무시되므로(PR base 브랜치를 API로 조회) 지정하지 않는다.
      # push 이벤트에서는 base를 생략하면 저장소 기본 브랜치(main)로 자동 결정된다.
      # main push는 base와 head가 같으므로, paths-filter가 push 전 마지막 커밋
      # (github.event.before) 기준으로 diff를 비교한다 — 병합 커밋의 변경분만 잡힌다.
      - name: 변경 감지
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'compose.dev.yml'
              - '.github/workflows/**'
            backend:
              - 'apps/backend/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'compose.dev.yml'
              - 'scripts/run-backend-integration*.sh'
              - 'scripts/check-open-prisma-migration-prs*'
              - 'scripts/test-prisma-migration-concurrency*'
              - 'scripts/prisma-migration-ledger.mjs'
              - 'scripts/member-authority-expand-contract.mjs'
              - 'scripts/member-authority-contract-contract*'
              - 'scripts/member-authority-contract-sources.mjs'
              - 'scripts/member-authority-contract-seed.mjs'
              - 'scripts/check-member-authority-contract.sh'
              - 'scripts/rehearse-member-authority-migrations*'
              - 'scripts/rehearse-member-authority-contract*'
              - 'scripts/rehearse-legacy-submission-migrations*'
              - 'scripts/check-member-authority-production*'
              - 'scripts/member-authority-production-report.mjs'
              - 'scripts/member-authority-jenkins-contract.test.mjs'
              - 'scripts/ci-path-contract.test.mjs'
              - '.github/workflows/**'
            nginx:
              - 'deploy/nginx/**'
              - 'deploy/nginx-local/**'
              - 'deploy/host-nginx/**'
              - 'scripts/probe-nginx-callback-log.sh'
              - 'scripts/check-host-nginx*.sh'
              - 'scripts/check-submission-upload-route*.sh'
              - '.github/workflows/**'
            production_compose:
              - 'compose.yml'
              - 'compose.local.yml'
              - 'deploy/nginx-local/**'
              - '.env.example'
              - 'scripts/check-env-example-coverage.mjs'
              - 'scripts/check-env-example-coverage-lib.mjs'
              - 'scripts/check-env-example-coverage.test.mjs'
              - 'scripts/docker-verify-local.sh'
              - 'scripts/docker-verify-local.test.sh'
              - 'scripts/_compose-lib.sh'
              - 'apps/backend/src/**'
              - 'apps/frontend/src/**'
              - '.github/workflows/**'
            jenkins:
              - 'Jenkinsfile'
              - 'compose.yml'
              - 'apps/*/Dockerfile'
              - 'deploy/jenkins/**'
              - 'scripts/jenkins/**'
              - 'scripts/jenkins/validate-production-env*'
              - 'scripts/jenkins/validate-rollback-images*'
              - 'scripts/check-jenkinsfile.sh'
              - 'scripts/check-jenkinsfile.test.sh'
              - 'scripts/check-jenkinsfile.test.mjs'
              - 'scripts/check-production-image-pins*.sh'
              - 'scripts/check-member-authority-production*'
              - 'scripts/member-authority-production-report.mjs'
              - 'scripts/member-authority-jenkins-contract.test.mjs'
              - 'scripts/ci-path-contract.test.mjs'
              - 'scripts/check-auth-production-readonly*'
              - 'scripts/auth-production-readonly-report.mjs'
              - 'scripts/prune-deploy-backups*.sh'
              - '.github/workflows/**'
            docker_context:
              - 'apps/*/Dockerfile'
              - '.dockerignore'
              - 'scripts/check-docker-context.sh'
              - 'scripts/check-docker-context.test.sh'
              - '.github/workflows/**'
            shell_scripts:
              - 'scripts/*.sh'
              - 'scripts/**/*.sh'
              - '.githooks/**'
              - '.github/workflows/**'
            node_scripts:
              - 'scripts/*.mjs'
              - '.github/workflows/**'

      # push(main)는 paths filter를 무시하고 전체 스코프를 강제한다. push 이벤트에서도
      # filter 결과를 그대로 쓰면, 특정 앱만 바뀐 커밋이 다른 앱의 lint/typecheck/test/build
      # 없이 main에 올라가고 그대로 Release로 배포될 수 있었다(배포 시점 재검증 삭제 전 마지막 방어선).
      # pull_request에서는 기존 paths filter 결과를 그대로 쓴다 — PR 비용 절감이 목적이므로 유지한다.
      - name: 실행 스코프 결정
        id: scope
        run: |
          {
            echo "frontend=${{ github.event_name == 'push' && 'true' || steps.changes.outputs.frontend }}"
            echo "backend=${{ github.event_name == 'push' && 'true' || steps.changes.outputs.backend }}"
            echo "nginx=${{ github.event_name == 'push' && 'true' || steps.changes.outputs.nginx }}"
            echo "production_compose=${{ github.event_name == 'push' && 'true' || steps.changes.outputs.production_compose }}"
            echo "jenkins=${{ github.event_name == 'push' && 'true' || steps.changes.outputs.jenkins }}"
            echo "docker_context=${{ github.event_name == 'push' && 'true' || steps.changes.outputs.docker_context }}"
            echo "shell_scripts=${{ github.event_name == 'push' && 'true' || steps.changes.outputs.shell_scripts }}"
            echo "node_scripts=${{ github.event_name == 'push' && 'true' || steps.changes.outputs.node_scripts }}"
          } >> "$GITHUB_OUTPUT"

      # 의존성이 없는 Node 내장 테스트는 모든 PR에서 실행한다.
      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: TEAM-STATE drift 검사기 단위테스트
        run: node --test scripts/team-state-check.test.mjs

      - name: CI path 계약 검사
        run: node --test scripts/ci-path-contract.test.mjs

      # 릴리스 배포 대상 판정은 배포 인가 경로의 게이트이므로 모든 PR에서 고정한다.
      # 이 판정이 조용히 비면 모든 릴리스가 no-op이 되어 배포가 멈춘다.
      - name: 릴리스 배포 스코프 판정 단위테스트
        run: node --test scripts/select-release-deploy-scope.test.mjs

      # 앱 변경이 있을 때만 pnpm store를 만들고 캐시한다. docs-only PR에서
      # 존재하지 않는 store를 저장하려는 setup-node 후처리 실패를 막는다.
      - name: pnpm 설정
        if: ${{ steps.scope.outputs.frontend == 'true' || steps.scope.outputs.backend == 'true' || steps.scope.outputs.production_compose == 'true' || steps.scope.outputs.jenkins == 'true' }}
        uses: pnpm/action-setup@v4

      - name: pnpm 캐시 설정
        if: ${{ steps.scope.outputs.frontend == 'true' || steps.scope.outputs.backend == 'true' || steps.scope.outputs.production_compose == 'true' || steps.scope.outputs.jenkins == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # bash -n 은 첫 인자만 파싱하고 나머지는 위치 인자로 버린다. 한 파일씩 돌려야 전수 검사가 된다.
      - name: shell script 문법 검사
        if: ${{ steps.scope.outputs.shell_scripts == 'true' }}
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          for hook in .githooks/*; do
            bash -n "$hook"
          done

      - name: TEAM-STATE pre-push 가드 회귀 테스트
        if: ${{ steps.scope.outputs.shell_scripts == 'true' }}
        run: bash scripts/check-team-state-updated.test.sh

      - name: 호스트 lane DATABASE_URL 가드 회귀 테스트
        if: ${{ steps.scope.outputs.shell_scripts == 'true' }}
        run: bash scripts/check-host-db-url.test.sh

      - name: Node script 문법 검사
        if: ${{ steps.scope.outputs.node_scripts == 'true' }}
        run: |
          for script in scripts/*.mjs; do
            node --check "$script"
          done

      - name: nginx ingress 계약 검사
        if: ${{ steps.scope.outputs.nginx == 'true' }}
        run: |
          docker run --rm \
            --add-host backend:127.0.0.1 \
            --add-host frontend:127.0.0.1 \
            --volume "$PWD/deploy/nginx-local/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10 nginx -t
          bash scripts/probe-nginx-callback-log.sh
          bash scripts/check-host-nginx.test.sh
          bash scripts/check-host-nginx.sh
          bash scripts/check-submission-upload-route.test.sh
          bash scripts/check-submission-upload-route.sh

      - name: Jenkins 배포 계약 회귀 테스트
        if: ${{ steps.scope.outputs.jenkins == 'true' }}
        run: |
          node --test scripts/jenkins/validate-production-env.test.mjs
          node --test scripts/jenkins/validate-github-app-credentials.test.mjs
          node --test scripts/check-member-authority-production.test.mjs scripts/member-authority-jenkins-contract.test.mjs
          node --test scripts/check-auth-production-readonly.test.mjs
          bash scripts/check-production-image-pins.test.sh
          bash scripts/check-production-image-pins.sh
          node --test scripts/check-jenkinsfile.test.mjs
          bash scripts/check-jenkinsfile.test.sh
          bash scripts/check-jenkinsfile.sh Jenkinsfile
          # 어떤 workflow도 Jenkins를 트리거하지 않는다 — 배포는 outbound convergence만 사용한다(ADR-002).
          ! grep -rlE 'oss-hub-release-c[d]|JENKINS[_]' .github/workflows
          bash scripts/jenkins/validate-rollback-images.test.sh
          bash scripts/prune-deploy-backups.test.sh

      - name: Docker build context 계약 회귀 테스트
        if: ${{ steps.scope.outputs.docker_context == 'true' }}
        run: |
          bash scripts/check-docker-context.test.sh
          bash scripts/check-docker-context.sh

      - name: 의존성 설치
        if: ${{ steps.scope.outputs.frontend == 'true' || steps.scope.outputs.backend == 'true' || steps.scope.outputs.production_compose == 'true' || steps.scope.outputs.jenkins == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: env 계약 양방향 검사
        if: ${{ steps.scope.outputs.production_compose == 'true' }}
        run: |
          node --test scripts/check-env-example-coverage.test.mjs
          node scripts/check-env-example-coverage.mjs --require-docker

      - name: 로컬 두 파일 compose 계약 회귀 테스트
        if: ${{ steps.scope.outputs.production_compose == 'true' }}
        run: bash scripts/docker-verify-local.test.sh

      - name: prettier 포맷 검사
        if: ${{ steps.scope.outputs.frontend == 'true' || steps.scope.outputs.backend == 'true' }}
        run: pnpm format:check

      - name: frontend lint
        if: ${{ steps.scope.outputs.frontend == 'true' }}
        run: pnpm --filter frontend lint

      - name: frontend typecheck
        if: ${{ steps.scope.outputs.frontend == 'true' }}
        run: pnpm --filter frontend typecheck

      - name: frontend test
        if: ${{ steps.scope.outputs.frontend == 'true' }}
        run: pnpm --filter frontend test

      - name: frontend build
        if: ${{ steps.scope.outputs.frontend == 'true' }}
        env:
          BACKEND_ORIGIN: https://backend.example.test
        run: pnpm --filter frontend build

      - name: Prisma migration contract unit tests
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: node --test scripts/rehearse-member-authority-migrations.test.mjs scripts/rehearse-legacy-submission-migrations.test.mjs scripts/member-authority-contract-contract.test.mjs scripts/prisma-migration-ledger.test.mjs scripts/check-open-prisma-migration-prs.test.mjs scripts/check-jenkinsfile.test.mjs scripts/test-prisma-migration-concurrency.test.mjs

      # 위 단계는 검사기가 합성 문자열에 대해 올바른지만 본다. 이 단계는 그 검사기를
      # **저장소의 실제 파일**(스키마·contract 마이그레이션·추적 중인 생산 TS)에 돌린다.
      # 둘 다 있어야 한다 — 앞은 검사기의 결함을, 뒤는 저장소의 회귀를 잡는다.
      - name: contract on real sources
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: bash scripts/check-member-authority-contract.sh

      - name: backend lint
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: pnpm --filter backend lint

      - name: backend typecheck
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: pnpm --filter backend typecheck

      - name: backend unit test
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: pnpm --filter backend test:unit

      - name: backend integration runner contract
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: bash scripts/run-backend-integration.test.sh

      - name: backend integration test
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: pnpm --filter backend test:integration

      - name: Prisma migration concurrency
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: bash scripts/test-prisma-migration-concurrency.sh

      - name: backend build
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: pnpm --filter backend build

      # Playwright 묶음은 CI에서 돌리지 않는다(PM 결정, 2026-08-11). 브라우저·ffmpeg
      # 설치와 dev 서버 온디맨드 컴파일에 의존해 러너 환경 결함이 제품 결함으로
      # 둔갑하고(#856), PR에서는 어차피 실행되지 않아 회귀를 늦게만 알려 준다.
      # 실행은 로컬 `pnpm --filter frontend e2e`로 옮긴다 — 릴리스 전 수동 게이트다.

  # 1차 도입은 advisory다. drift·unknown은 non-zero로 보고하되 required ci를 차단하지 않는다.
  team-state-drift:
    name: team-state-drift (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: GitHub 상태 drift 검사
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/team-state-check.mjs

  # 커밋 메시지 규칙(AGENTS.md §5)은 변경 경로와 무관하므로 paths-filter 없이 모든 PR에서 실행한다.
  # issue 이벤트에는 GITHUB_BASE_REF가 없어 실행하지 않는다.
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pnpm 설정
        uses: pnpm/action-setup@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # prisma generate 등 앱 postinstall은 이 검사에 불필요하므로 건너뛴다.
      - name: 의존성 설치 (ignore-scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Conventional Commits 검사
        run: pnpm exec commitlint --config commitlint.config.cjs --from "origin/${GITHUB_BASE_REF}" --to HEAD --verbose

  # deny-list 표면은 문서·PR 본문이 핵심이므로 paths-filter 없이 모든 PR에서 항상 실행한다.
  # branch protection에서 required check로 등록해야 강제된다.
  public-safe:
    name: public-safe
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: public-safe regex 회귀 테스트
        run: bash scripts/check-public-safe.test.sh

      # org repo는 gitleaks-action이 라이선스 키를 요구하므로 MIT 라이선스인 CLI를 직접 실행한다.
      # https://github.com/gitleaks/gitleaks-action#environment-variables
      - name: gitleaks 시크릿 스캔 (이 PR의 신규 커밋만)
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --log-opts="origin/${GITHUB_BASE_REF}..HEAD" .

      # PR 본문은 ${{ }} 인라인 치환이 아니라 env 주입 — script injection 방지 (GitHub 공식 권고)
      - name: public-safe regex 스캔 (deny-list)
        env:
          PR_TEXT: |
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}
        run: bash scripts/check-public-safe.sh "origin/${GITHUB_BASE_REF}"

  # Issue 본문·댓글까지 deny-list 스캔 확장 (PR title/body만 검사하던 사각지대 — #56 실증).
  # Issue에는 required check 병합 게이트가 없으므로 탐지·가시화 목적으로 실행한다.
  public-safe-issue:
    name: public-safe-issue
    if: github.event_name == 'issues' || github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      # Issue 본문·댓글도 ${{ }} 인라인 치환이 아니라 env 주입 — script injection 방지
      - name: public-safe regex 스캔 (Issue 본문·댓글, deny-list)
        env:
          ISSUE_TEXT: |
            ${{ github.event.issue.title }}
            ${{ github.event.issue.body }}
            ${{ github.event.comment.body }}
        run: bash scripts/check-public-safe.sh --text-only

  # 배포 인가는 GitHub Release의 발행 자체다(ADR-002). backend는 Jenkins가 tailnet에서
  # outbound로 최신 Release에 수렴하고, 이 job은 주체가 없던 frontend(Vercel) 배포를
  # 같은 인가 이벤트 위로 올린다. production Compose에는 frontend runtime이 없으므로
  # backend 배포는 이미 backend 전용이고 이 job은 Jenkins 동작을 바꾸지 않는다.
  #
  # required check이 아니다. required check에 path filter를 걸면 그 경로를 건드리지 않은
  # PR에서 체크가 영영 보고되지 않아 병합이 막힌다 — 선택 실행은 required가 아닌 이 job만 한다.
  frontend-release-deploy:
    name: frontend-release-deploy
    if: ${{ github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 배포 대상은 branch head가 아니라 tag가 가리키는 정확한 SHA다.
      # 직전 릴리스와의 diff를 계산해야 하므로 전체 이력을 받는다.
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      # 잘못된 릴리스 입력은 배포를 시작하기 전에 멈춘다.
      - name: 릴리스 입력 검증
        id: release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "full SemVer tag가 아니다: $TAG" >&2
            exit 1
          fi
          sha="$(git rev-list -n 1 "refs/tags/$TAG")"
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "release SHA가 main 이력에 없다: $sha" >&2
            exit 1
          fi
          echo "RELEASE_INPUT tag=$TAG sha=$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # 직전 full SemVer 릴리스 태그도 불변 참조다. 두 태그 사이 diff만으로 판정하므로
      # 배포 플랫폼 상태를 읽지 않고 저장소만으로 재현된다.
      # 직전 릴리스가 없으면(최초 릴리스) 비교 기준이 없으므로 배포한다.
      - name: 배포 대상 판정
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" \
            --exclude-drafts --exclude-pre-releases --limit 100 \
            --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vFx "$TAG" | head -n 1 || true)"
          if [ -z "$previous" ]; then
            echo "RELEASE_SCOPE previous=none frontend=true backend=true (최초 릴리스)"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet origin "refs/tags/$previous:refs/tags/$previous" || true
          git diff --name-only "refs/tags/$previous" "refs/tags/$TAG" \
            | node scripts/select-release-deploy-scope.mjs > /tmp/release-scope
          echo "RELEASE_SCOPE previous=$previous $(tr '\n' ' ' < /tmp/release-scope)"
          cat /tmp/release-scope >> "$GITHUB_OUTPUT"

      # 건너뛴 사실이 로그에 남아야 「배포가 안 됐다」와 「배포할 게 없었다」가 구분된다.
      - name: frontend 무변경 no-op
        if: ${{ steps.scope.outputs.frontend != 'true' }}
        run: echo "frontend 배포 산출물에 변경이 없어 Vercel 배포를 건너뛴다."

      - name: Vercel production 배포
        if: ${{ steps.scope.outputs.frontend == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "$name 시크릿이 없어 배포를 진행할 수 없다" >&2
              exit 1
            fi
          done
          npx --yes vercel@58 deploy --prod --yes --token "$VERCEL_TOKEN"
          echo "RELEASE_DEPLOY target=vercel sha=$SHA"
