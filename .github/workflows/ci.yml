name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  release:
    types: [published]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: ci
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: push 기준 커밋 확보
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BEFORE//0/}" ] && ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BEFORE"
          fi

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 실행 스코프 결정
        id: scope
        run: |
          set -euo pipefail
          node verify/index.mjs scope > "$RUNNER_TEMP/verify-scope.json"
          jq -r '
            "frontend=\(.frontend)",
            "backend=\(.backend)",
            "nginx=\(.nginx)",
            "jenkins=\(.jenkins)",
            "shell_scripts=\(.shellScripts)",
            "node_scripts=\(.nodeScripts)",
            "rails=\(.rails)"
          ' "$RUNNER_TEMP/verify-scope.json" >> "$GITHUB_OUTPUT"

      - name: 릴리스 배포 스코프 판정 단위테스트
        run: node --test deploy/frontend/select-release-deploy-scope.test.mjs

      - name: pnpm 설정
        if: ${{ steps.scope.outputs.frontend == 'true' || steps.scope.outputs.backend == 'true' || steps.scope.outputs.jenkins == 'true' }}
        uses: pnpm/action-setup@v4

      - name: pnpm 캐시 설정
        if: ${{ steps.scope.outputs.frontend == 'true' || steps.scope.outputs.backend == 'true' || steps.scope.outputs.jenkins == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: shell script 문법 검사
        if: ${{ steps.scope.outputs.shell_scripts == 'true' }}
        run: |
          bash -n dev.sh
          find deploy apps/backend/prisma apps/backend/test .github -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          for hook in .githooks/*; do
            bash -n "$hook"
          done

      - name: 호스트 lane DATABASE_URL 가드 회귀 테스트
        if: ${{ steps.scope.outputs.shell_scripts == 'true' }}
        run: bash apps/backend/prisma/check-host-db-url.test.sh

      - name: pre-commit 훅 파일명 전달 회귀 테스트
        if: ${{ steps.scope.outputs.shell_scripts == 'true' }}
        run: bash .githooks/pre-commit.test.sh

      - name: pre-push 훅 회귀 테스트
        if: ${{ steps.scope.outputs.shell_scripts == 'true' }}
        run: bash .githooks/pre-push.test.sh

      - name: Node script 문법 검사
        if: ${{ steps.scope.outputs.node_scripts == 'true' }}
        run: |
          find deploy verify -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: nginx ingress 계약 검사
        if: ${{ steps.scope.outputs.nginx == 'true' }}
        run: |
          docker run --rm \
            --add-host backend:127.0.0.1 \
            --volume "$PWD/deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10 nginx -t
          bash deploy/checks/check-host-nginx.test.sh
          bash deploy/checks/check-host-nginx.sh
          bash deploy/checks/check-submission-upload-route.test.sh
          bash deploy/checks/check-submission-upload-route.sh

      - name: Jenkins 배포 계약 회귀 테스트
        if: ${{ steps.scope.outputs.jenkins == 'true' }}
        run: |
          docker compose --env-file /dev/null -f compose.yml config --no-interpolate --quiet
          node --test deploy/jenkins/release-behavior.test.mjs
          node --test deploy/jenkins/user-consolidation*.test.mjs
          node --test deploy/jenkins/program-migration/*.test.mjs
          docker run --rm --volume "$PWD:/mnt:ro" --workdir /mnt koalaman/shellcheck:stable@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d -x -P SCRIPTDIR deploy/jenkins/program-migration/*.sh
          node --test deploy/jenkins/validate-production-env.test.mjs
          node --test deploy/jenkins/validate-github-app-credentials.test.mjs
          ! grep -rlE 'oss-hub-release-c[d]|JENKINS[_]' .github/workflows
          bash deploy/jenkins/prune-deploy-backups.test.sh

      - name: 의존성 설치
        if: ${{ steps.scope.outputs.frontend == 'true' || steps.scope.outputs.backend == 'true' || steps.scope.outputs.jenkins == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Knip 구조 검사
        if: ${{ steps.scope.outputs.rails == 'true' }}
        run: pnpm lint:structure

      - name: prettier 포맷 검사
        if: ${{ steps.scope.outputs.frontend == 'true' || steps.scope.outputs.backend == 'true' }}
        run: pnpm format:check

      - name: frontend lint
        if: ${{ steps.scope.outputs.frontend == 'true' }}
        run: pnpm --filter frontend lint

      - name: frontend typecheck
        if: ${{ steps.scope.outputs.frontend == 'true' }}
        run: pnpm --filter frontend typecheck

      - name: frontend test
        if: ${{ steps.scope.outputs.frontend == 'true' }}
        run: pnpm --filter frontend test

      - name: frontend build
        if: ${{ steps.scope.outputs.frontend == 'true' }}
        env:
          BACKEND_ORIGIN: https://backend.example.test
        run: pnpm --filter frontend build

      - name: backend lint
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: pnpm --filter backend lint

      - name: backend typecheck
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: pnpm --filter backend typecheck

      - name: backend unit test
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: pnpm --filter backend test:unit

      - name: backend integration runner contract
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: bash apps/backend/test/run-integration.test.sh

      - name: ledger collector race test
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: bash apps/backend/prisma/github-ledger-collector-race.test.sh

      - name: backend integration test
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: pnpm --filter backend test:integration

      - name: backend build
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: pnpm --filter backend build

  verify:
    name: verify
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: push 기준 커밋 확보
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BEFORE//0/}" ] && ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BEFORE"
          fi

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 검증 스코프 결정
        id: scope
        run: |
          set -euo pipefail
          node verify/index.mjs scope > "$RUNNER_TEMP/verify-scope.json"
          jq -r '"frontend=\(.frontend)", "backend=\(.backend)"' "$RUNNER_TEMP/verify-scope.json" >> "$GITHUB_OUTPUT"

      - name: gitleaks 설치
        run: |
          set -euo pipefail
          curl -sSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: oasdiff 설치
        run: |
          set -euo pipefail
          curl -sSL -o "$RUNNER_TEMP/oasdiff.tar.gz" https://github.com/oasdiff/oasdiff/releases/download/v1.38.0/oasdiff_1.38.0_linux_amd64.tar.gz
          echo "613037fd6a1d3362a1b742d6d86c338c0eb5ab3511f4942ce3948e78720ea2da  $RUNNER_TEMP/oasdiff.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP/bin" oasdiff
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: pnpm 설정
        if: ${{ steps.scope.outputs.frontend == 'true' || steps.scope.outputs.backend == 'true' }}
        uses: pnpm/action-setup@v4

      - name: pnpm 캐시 설정
        if: ${{ steps.scope.outputs.frontend == 'true' || steps.scope.outputs.backend == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치
        if: ${{ steps.scope.outputs.frontend == 'true' || steps.scope.outputs.backend == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: verify 스크립트 테스트
        if: ${{ steps.scope.outputs.frontend == 'true' || steps.scope.outputs.backend == 'true' }}
        run: pnpm test:verify

      - name: 스코프별 verify (secrets, API 계약, 쿼리 게이트)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node verify/index.mjs scoped

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pnpm 설정
        uses: pnpm/action-setup@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치 (ignore-scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Conventional Commits 검사
        run: pnpm exec commitlint --config commitlint.config.cjs --from "origin/${GITHUB_BASE_REF}" --to HEAD --verbose

  public-safe:
    name: public-safe
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - &install-gitleaks
        name: gitleaks 설치
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: public-safe 회귀 테스트
        run: bash .github/check-public-safe.test.sh

      - name: gitleaks 시크릿 스캔 (이 PR의 신규 커밋만)
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="origin/${GITHUB_BASE_REF}..HEAD" .

      - name: public-safe 스캔 (PR 이벤트 파일)
        if: ${{ !cancelled() }}
        run: bash .github/check-public-safe.sh --event "origin/${GITHUB_BASE_REF}"

  public-safe-issue:
    name: public-safe-issue
    if: github.event_name == 'issues' || github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - *install-gitleaks

      - name: public-safe 스캔 (Issue 이벤트 파일)
        run: bash .github/check-public-safe.sh --event

  frontend-release-deploy:
    name: frontend-release-deploy
    if: ${{ github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    concurrency:
      group: frontend-production
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: 릴리스 입력 검증
        id: release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "full SemVer tag가 아니다: $TAG" >&2
            exit 1
          fi
          sha="$(git rev-list -n 1 "refs/tags/$TAG")"
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "release SHA가 main 이력에 없다: $sha" >&2
            exit 1
          fi
          echo "RELEASE_INPUT tag=$TAG sha=$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: 배포 대상 판정
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: node deploy/frontend/select-release-deploy-scope.mjs >> "$GITHUB_OUTPUT"

      - name: frontend 무변경 no-op
        if: ${{ steps.scope.outputs.frontend != 'true' }}
        run: echo "frontend 배포 산출물에 변경이 없어 Vercel 배포를 건너뛴다."

      - name: Vercel production 배포
        if: ${{ steps.scope.outputs.frontend == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "$name 시크릿이 없어 배포를 진행할 수 없다" >&2
              exit 1
            fi
          done
          npx --yes vercel@58 deploy --prod --yes --token "$VERCEL_TOKEN"
          echo "RELEASE_DEPLOY target=vercel sha=$SHA"
