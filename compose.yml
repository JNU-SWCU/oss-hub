services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    image: oss-hub-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      # migration과 runtime은 서버 .env의 postgres 서비스 DNS를 가리키는 동일한 DATABASE_URL을 사용한다.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      TEAM_JOIN_CODE_SECRET: ${TEAM_JOIN_CODE_SECRET:?TEAM_JOIN_CODE_SECRET is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:?GITHUB_OAUTH_CLIENT_ID is required}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:?GITHUB_OAUTH_CLIENT_SECRET is required}
      # Optional compatibility placeholder. Runtime derives and validates the callback from FRONTEND_URL.
      GITHUB_OAUTH_CALLBACK_URL: ${GITHUB_OAUTH_CALLBACK_URL:-}
      GITHUB_COLLECTION_APP_ID: ${GITHUB_COLLECTION_APP_ID:?GITHUB_COLLECTION_APP_ID is required}
      GITHUB_APP_ORG: ${GITHUB_APP_ORG:?GITHUB_APP_ORG is required}
      GITHUB_COLLECTION_APP_PRIVATE_KEY: ${GITHUB_COLLECTION_APP_PRIVATE_KEY:?GITHUB_COLLECTION_APP_PRIVATE_KEY is required}
      GITHUB_COLLECTION_APP_API_BASE_URL: ${GITHUB_COLLECTION_APP_API_BASE_URL:-}
      GITHUB_COLLECTION_APP_MAX_PAGES: ${GITHUB_COLLECTION_APP_MAX_PAGES:-}
      GITHUB_COLLECTION_APP_DEADLINE_MS: ${GITHUB_COLLECTION_APP_DEADLINE_MS:-}
      SUBMISSION_FILE_S3_ENDPOINT: ${SUBMISSION_FILE_S3_ENDPOINT:?SUBMISSION_FILE_S3_ENDPOINT is required}
      SUBMISSION_FILE_S3_REGION: ${SUBMISSION_FILE_S3_REGION:?SUBMISSION_FILE_S3_REGION is required}
      SUBMISSION_FILE_S3_BUCKET: ${SUBMISSION_FILE_S3_BUCKET:?SUBMISSION_FILE_S3_BUCKET is required}
      SUBMISSION_FILE_S3_ACCESS_KEY_ID: ${SUBMISSION_FILE_S3_ACCESS_KEY_ID:?SUBMISSION_FILE_S3_ACCESS_KEY_ID is required}
      SUBMISSION_FILE_S3_SECRET_ACCESS_KEY: ${SUBMISSION_FILE_S3_SECRET_ACCESS_KEY:?SUBMISSION_FILE_S3_SECRET_ACCESS_KEY is required}
      SUBMISSION_FILE_S3_FORCE_PATH_STYLE: ${SUBMISSION_FILE_S3_FORCE_PATH_STYLE:?SUBMISSION_FILE_S3_FORCE_PATH_STYLE is required}
      # production 이미지(NODE_ENV=production)는 GMAIL_* 4종이 없으면 부팅을 거부한다.
      # compose --env-file 치환만으로는 컨테이너에 전달되지 않으므로 여기서 명시 매핑한다.
      GMAIL_SENDER: ${GMAIL_SENDER:?GMAIL_SENDER is required}
      GMAIL_OAUTH_CLIENT_ID: ${GMAIL_OAUTH_CLIENT_ID:?GMAIL_OAUTH_CLIENT_ID is required}
      GMAIL_OAUTH_CLIENT_SECRET: ${GMAIL_OAUTH_CLIENT_SECRET:?GMAIL_OAUTH_CLIENT_SECRET is required}
      GMAIL_OAUTH_REFRESH_TOKEN: ${GMAIL_OAUTH_REFRESH_TOKEN:?GMAIL_OAUTH_REFRESH_TOKEN is required}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '4000'
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '--fail',
          '--silent',
          'http://localhost:4000/api/v1/health',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    image: oss-hub-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:3000/']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      # 공인 80/443은 host nginx가 담당하고 Compose ingress는 loopback에서만 받는다.
      - '127.0.0.1:8081:80'
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
