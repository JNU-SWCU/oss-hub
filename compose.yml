services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data
    environment:
      # 앱과 같은 자격증명을 쓴다. 외부 노출이 없고 버킷도 하나뿐이라 별도 키를 두지 않는다.
      MINIO_ROOT_USER: ${SUBMISSION_FILE_S3_ACCESS_KEY_ID:?SUBMISSION_FILE_S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${SUBMISSION_FILE_S3_SECRET_ACCESS_KEY:?SUBMISSION_FILE_S3_SECRET_ACCESS_KEY is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '--fail',
          '--silent',
          'http://localhost:9000/minio/health/ready',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-bucket:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${SUBMISSION_FILE_S3_ACCESS_KEY_ID:?SUBMISSION_FILE_S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${SUBMISSION_FILE_S3_SECRET_ACCESS_KEY:?SUBMISSION_FILE_S3_SECRET_ACCESS_KEY is required}
      # backend의 기본값과 반드시 같아야 한다. 갈라지면 앱이 없는 버킷에 업로드한다.
      SUBMISSION_FILE_S3_BUCKET: ${SUBMISSION_FILE_S3_BUCKET:-oss-hub-submission-files}
    # 마커는 컨테이너 재시작 시 유지되지만 --force-recreate 시 사라지므로 entrypoint에서 다시 만든다.
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - >-
        rm -f /tmp/bucket-ready &&
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null &&
        mc mb --ignore-existing "local/$${SUBMISSION_FILE_S3_BUCKET}" >/dev/null &&
        mc anonymous set none "local/$${SUBMISSION_FILE_S3_BUCKET}" >/dev/null &&
        touch /tmp/bucket-ready &&
        exec sleep infinity
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/bucket-ready']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    image: oss-hub-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      # migration과 runtime은 서버 .env의 postgres 서비스 DNS를 가리키는 동일한 DATABASE_URL을 사용한다.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      TEAM_JOIN_CODE_SECRET: ${TEAM_JOIN_CODE_SECRET:?TEAM_JOIN_CODE_SECRET is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:?GITHUB_OAUTH_CLIENT_ID is required}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:?GITHUB_OAUTH_CLIENT_SECRET is required}
      # Optional compatibility placeholder. Runtime derives and validates the callback from FRONTEND_URL.
      GITHUB_OAUTH_CALLBACK_URL: ${GITHUB_OAUTH_CALLBACK_URL:-}
      GITHUB_COLLECTION_APP_ID: ${GITHUB_COLLECTION_APP_ID:?GITHUB_COLLECTION_APP_ID is required}
      GITHUB_APP_ORG: ${GITHUB_APP_ORG:?GITHUB_APP_ORG is required}
      # 기본값은 아래 secrets 이름과 짝을 이룬다 — 한쪽만 바꾸면 마운트 지점과 어긋난다.
      GITHUB_COLLECTION_APP_PRIVATE_KEY_FILE: ${GITHUB_COLLECTION_APP_PRIVATE_KEY_FILE:-/run/secrets/github_collection_app_private_key}
      GITHUB_COLLECTION_APP_API_BASE_URL: ${GITHUB_COLLECTION_APP_API_BASE_URL:-}
      GITHUB_COLLECTION_APP_MAX_PAGES: ${GITHUB_COLLECTION_APP_MAX_PAGES:-}
      GITHUB_COLLECTION_APP_DEADLINE_MS: ${GITHUB_COLLECTION_APP_DEADLINE_MS:-}
      # 선택값. 조직 밖 public 저장소 탐색 전용 서비스 계정 PAT. 없으면 조직 수집은
      # 그대로 동작하고 외부 탐색만 비활성화된다.
      GITHUB_PUBLIC_READ_TOKEN: ${GITHUB_PUBLIC_READ_TOKEN:-}
      GITHUB_OPERATIONS_APP_ID: ${GITHUB_OPERATIONS_APP_ID:?GITHUB_OPERATIONS_APP_ID is required}
      GITHUB_OPERATIONS_APP_PRIVATE_KEY_FILE: ${GITHUB_OPERATIONS_APP_PRIVATE_KEY_FILE:-/run/secrets/github_operations_app_private_key}
      # 선택값. 코드 기본 cron은 매시 정각(초 포함 6필드), listen 포트 기본은 4000.
      COLLECTION_CRON_EXPRESSION: ${COLLECTION_CRON_EXPRESSION:-}
      PORT: ${PORT:-4000}
      # 아래 4개는 이 스택의 MinIO 토폴로지가 이미 결정한 값이라 기본값을 둔다.
      # 운영자가 배포일에 채워야 하는 저장소 키는 access key와 secret 둘뿐이다.
      # 관리형 S3로 옮길 때는 env에 이 4개를 지정하면 되고 코드 변경은 없다.
      SUBMISSION_FILE_S3_ENDPOINT: ${SUBMISSION_FILE_S3_ENDPOINT:-http://minio:9000}
      SUBMISSION_FILE_S3_REGION: ${SUBMISSION_FILE_S3_REGION:-us-east-1}
      SUBMISSION_FILE_S3_BUCKET: ${SUBMISSION_FILE_S3_BUCKET:-oss-hub-submission-files}
      SUBMISSION_FILE_S3_ACCESS_KEY_ID: ${SUBMISSION_FILE_S3_ACCESS_KEY_ID:?SUBMISSION_FILE_S3_ACCESS_KEY_ID is required}
      SUBMISSION_FILE_S3_SECRET_ACCESS_KEY: ${SUBMISSION_FILE_S3_SECRET_ACCESS_KEY:?SUBMISSION_FILE_S3_SECRET_ACCESS_KEY is required}
      SUBMISSION_FILE_S3_FORCE_PATH_STYLE: ${SUBMISSION_FILE_S3_FORCE_PATH_STYLE:-true}
      # 미설정이면 역할 시드를 적용하지 않는다.
      AUTH_INITIAL_ROLES: ${AUTH_INITIAL_ROLES:-}
      # MAIL_MODE는 exact send|dry-run만 허용한다. 운영은 send, 로컬 예시는 dry-run을 쓴다.
      # Gmail 자격은 컨테이너에 선택 전달하고 MAIL_MODE=send일 때 앱이 4종 전부를 검증한다.
      # compose --env-file 치환만으로는 컨테이너에 전달되지 않으므로 여기서 명시 매핑한다.
      MAIL_MODE: ${MAIL_MODE:?MAIL_MODE is required}
      GMAIL_SENDER: ${GMAIL_SENDER:-}
      GMAIL_OAUTH_CLIENT_ID: ${GMAIL_OAUTH_CLIENT_ID:-}
      GMAIL_OAUTH_CLIENT_SECRET: ${GMAIL_OAUTH_CLIENT_SECRET:-}
      GMAIL_OAUTH_REFRESH_TOKEN: ${GMAIL_OAUTH_REFRESH_TOKEN:-}
    secrets:
      - github_collection_app_private_key
      - github_operations_app_private_key
    depends_on:
      postgres:
        condition: service_healthy
      minio-bucket:
        condition: service_healthy
    expose:
      - '4000'
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '--fail',
          '--silent',
          'http://localhost:4000/api/v1/health',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    image: oss-hub-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:3000/']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      # 공인 80/443은 host nginx가 담당하고 Compose ingress는 loopback에서만 받는다.
      - '127.0.0.1:8081:80'
    volumes:
      # 단일 파일 마운트는 inode를 고정해 배포 뒤 낡은 설정이 남으므로 디렉터리를 마운트한다.
      - ./deploy/nginx:/etc/nginx/conf.d:ro

volumes:
  pgdata:
  minio_data:

# uid/gid/mode를 일부러 지정하지 않는다 — 호스트 파일의 소유·모드가 그대로 컨테이너에
# 전달되므로(Compose v5.3.1 실측) 지정하면 설치 측이 보장하는 0640 + gid 1000과 어긋난다.
# 필수 표기(:?)가 legacy 값 키에서 이 SOURCE 경로 키로 옮겨왔다.
secrets:
  github_collection_app_private_key:
    file: ${GITHUB_COLLECTION_APP_PRIVATE_KEY_SOURCE:?GITHUB_COLLECTION_APP_PRIVATE_KEY_SOURCE is required}
  github_operations_app_private_key:
    file: ${GITHUB_OPERATIONS_APP_PRIVATE_KEY_SOURCE:?GITHUB_OPERATIONS_APP_PRIVATE_KEY_SOURCE is required}
