services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: oss
      POSTGRES_PASSWORD: oss-dev
      POSTGRES_DB: ${POSTGRES_DB:-oss_hub}
    ports:
      - '${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oss -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5

  object-storage:
    image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    # 이미지 기본 사용자(uid 1000)는 root 소유로 새로 생기는 마운트 지점 /data에 쓰지 못해
    # PutObject가 500으로 실패한다. 로컬·CI 전용 substitute라 root로 실행한다.
    user: '0:0'
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${SUBMISSION_FILE_S3_BUCKET:-oss-hub-submission-files-local}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
    ports:
      - '${OBJECT_STORAGE_BIND_HOST:-127.0.0.1}:${OBJECT_STORAGE_PORT:-9000}:9090'
    volumes:
      - object_storage_data_dev:/data
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:9090/favicon.ico',
        ]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata_dev:
  object_storage_data_dev:
