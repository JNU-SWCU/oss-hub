services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: oss
      POSTGRES_PASSWORD: oss-dev
      POSTGRES_DB: ${POSTGRES_DB:-oss_hub}
    ports:
      - '${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oss -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-oss-hub-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-oss-hub-local-synthetic-secret}
    ports:
      - '${MINIO_BIND_HOST:-127.0.0.1}:${MINIO_PORT:-9000}:9000'
    volumes:
      - minio_data_dev:/data
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '--fail',
          '--silent',
          'http://localhost:9000/minio/health/ready',
        ]
      interval: 2s
      timeout: 5s
      retries: 15

  minio-bucket:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-oss-hub-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-oss-hub-local-synthetic-secret}
      SUBMISSION_FILE_S3_BUCKET: ${SUBMISSION_FILE_S3_BUCKET:-oss-hub-submission-files-local}
    # 마커는 컨테이너 재시작 시 유지되지만 --force-recreate 시 사라지므로 entrypoint에서 다시 만든다.
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - >-
        rm -f /tmp/bucket-ready &&
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null &&
        mc mb --ignore-existing "local/$${SUBMISSION_FILE_S3_BUCKET}" >/dev/null &&
        mc anonymous set none "local/$${SUBMISSION_FILE_S3_BUCKET}" >/dev/null &&
        touch /tmp/bucket-ready &&
        exec sleep infinity
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/bucket-ready']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

volumes:
  pgdata_dev:
  minio_data_dev:
