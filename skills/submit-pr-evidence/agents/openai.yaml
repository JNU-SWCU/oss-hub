interface:
  display_name: 'OSS Hub PR 증거 제출'
  short_description: 'PR을 열기 전에 계약과 영역별 증거를 확인합니다'
  default_prompt: 'Use $submit-pr-evidence before opening an OSS Hub PR. If an Issue exists, read its three contract sections. If the user approved ticketless work, use that scope, acceptance, and non-goals with a non-empty reason and do not fetch or invent an Issue. Run the public-safety check. Attach applicable frontend capture or backend diagram evidence. Visual or component changes need | 요소 | same-selector rows. Nonvisual browser routing or runtime-boundary changes with no changed rendered component still need Before/After: declare 비시각 브라우저 변경 — <nonempty reason> and a | 동작 | table with real before/after full captures plus actual browser/API behavior; do not invent component-element rows. Keep real images, after desktop and 390x844, SHA/route/viewport/synthetic state, public-safe review, and public attachments. Disclose isolated-origin differences; do not claim identical full URL or new executions. Missing applicable evidence blocks the PR. There is no general screenshot waiver and no N/A for missing evidence; genuine not-applicable sections need a non-empty reason and must not hide unavailable screenshots as N/A.'
