# Host TLS terminator for the production Elastic IP.
# This file is installed as /etc/nginx/conf.d/oss-hub.conf on jnu-oss-platform.

log_format oss_hub_safe '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';
limit_req_zone $binary_remote_addr zone=jenkins_trigger:10m rate=5r/m;

upstream oss_hub_compose {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name 54.116.116.174;

    access_log /var/log/nginx/oss-hub.access.log oss_hub_safe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 54.116.116.174;

    ssl_certificate /etc/letsencrypt/live/54.116.116.174/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/54.116.116.174/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/oss-hub.access.log oss_hub_safe;

    # 공개 Jenkins 표면은 이 POST endpoint 하나뿐이다. Jenkins UI는 localhost/Tailscale에 남긴다.
    location = /job/oss-hub-release-cd/buildWithParameters {
        limit_except POST {
            deny all;
        }
        client_max_body_size 8k;
        limit_req zone=jenkins_trigger burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://oss_hub_compose;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
