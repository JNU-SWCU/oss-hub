# Host TLS terminator for the authenticated Vercel origin.
# Install as /etc/nginx/conf.d/oss-hub.conf on the production host.

log_format oss_hub_safe '$remote_addr [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';
server_tokens off;

upstream oss_hub_compose {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name origin.jnu-oss-hub.com;

    access_log /var/log/nginx/oss-hub.access.log oss_hub_safe;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://origin.jnu-oss-hub.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name origin.jnu-oss-hub.com;

    ssl_certificate /etc/letsencrypt/live/origin.jnu-oss-hub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/origin.jnu-oss-hub.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/oss-hub.access.log oss_hub_safe;
    auth_basic "OSS Hub origin";
    auth_basic_user_file /etc/nginx/oss-hub-origin.htpasswd;

    proxy_hide_header X-Powered-By;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location = /api/v1/auth/github {
        limit_except GET { deny all; }
        proxy_pass http://oss_hub_compose;
        proxy_http_version 1.1;
        proxy_set_header Host jnu-oss-hub.com;
        proxy_set_header Authorization "";
        proxy_set_header X-Vercel-Forwarded-For $http_x_vercel_forwarded_for;
        proxy_set_header X-Origin-Rate-Key "";
        proxy_set_header X-RateLimit-Limit "";
        proxy_set_header X-RateLimit-Remaining "";
        proxy_set_header X-RateLimit-Reset "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location = /api/v1/auth/github/callback {
        limit_except GET { deny all; }
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
        proxy_pass http://oss_hub_compose;
        proxy_http_version 1.1;
        proxy_set_header Host jnu-oss-hub.com;
        proxy_set_header Authorization "";
        proxy_set_header X-Vercel-Forwarded-For $http_x_vercel_forwarded_for;
        proxy_set_header X-Origin-Rate-Key "";
        proxy_set_header X-RateLimit-Limit "";
        proxy_set_header X-RateLimit-Remaining "";
        proxy_set_header X-RateLimit-Reset "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location = /api/v1/admin/collection/trigger {
        limit_except POST { deny all; }
        proxy_pass http://oss_hub_compose;
        proxy_http_version 1.1;
        proxy_set_header Host jnu-oss-hub.com;
        proxy_set_header Authorization "";
        proxy_set_header X-Vercel-Forwarded-For $http_x_vercel_forwarded_for;
        proxy_set_header X-Origin-Rate-Key "";
        proxy_set_header X-RateLimit-Limit "";
        proxy_set_header X-RateLimit-Remaining "";
        proxy_set_header X-RateLimit-Reset "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location = /api/v1/admin/collection/discover-external {
        limit_except POST { deny all; }
        proxy_pass http://oss_hub_compose;
        proxy_http_version 1.1;
        proxy_set_header Host jnu-oss-hub.com;
        proxy_set_header Authorization "";
        proxy_set_header X-Vercel-Forwarded-For $http_x_vercel_forwarded_for;
        proxy_set_header X-Origin-Rate-Key "";
        proxy_set_header X-RateLimit-Limit "";
        proxy_set_header X-RateLimit-Remaining "";
        proxy_set_header X-RateLimit-Reset "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location /api/v1/ {
        limit_except GET HEAD POST PATCH DELETE { deny all; }
        client_max_body_size 6m;
        proxy_pass http://oss_hub_compose;
        proxy_http_version 1.1;
        proxy_set_header Host jnu-oss-hub.com;
        proxy_set_header Authorization "";
        proxy_set_header X-Vercel-Forwarded-For $http_x_vercel_forwarded_for;
        proxy_set_header X-Origin-Rate-Key "";
        proxy_set_header X-RateLimit-Limit "";
        proxy_set_header X-RateLimit-Remaining "";
        proxy_set_header X-RateLimit-Reset "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location / {
        auth_basic off;
        return 404;
    }
}
