# Host TLS terminator for the production Elastic IP.
# This file is installed as /etc/nginx/conf.d/oss-hub.conf on jnu-oss-platform.

log_format oss_hub_safe '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';
server_tokens off;
limit_req_zone $binary_remote_addr zone=jenkins_trigger:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=oauth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=admin_collection:10m rate=2r/m;

upstream oss_hub_compose {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name 54.116.116.174;

    access_log /var/log/nginx/oss-hub.access.log oss_hub_safe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 54.116.116.174;

    ssl_certificate /etc/letsencrypt/live/54.116.116.174/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/54.116.116.174/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/oss-hub.access.log oss_hub_safe;

    # Compose nginx already sets the same non-HSTS headers. Hide them here so
    # the public TLS response carries one copy of each value.
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;

    # 공개 Jenkins 표면은 파라미터 없는 exact POST endpoint 하나뿐이다. Jenkins UI는 localhost/Tailscale에 남긴다.
    location = /job/oss-hub-release-cd/build {
        limit_except POST {
            deny all;
        }
        client_max_body_size 8k;
        limit_req zone=jenkins_trigger burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth/github {
        limit_req zone=oauth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://oss_hub_compose;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /api/v1/auth/github/callback {
        limit_req zone=oauth burst=5 nodelay;
        limit_req_status 429;
        # OAuth callback URL carries `code`+`state`. A location `add_header` discards
        # every inherited server-level header, so re-declare the full set here with the
        # stricter `no-referrer` (mirrors deploy/nginx/nginx.conf) — the server-level
        # `strict-origin-when-cross-origin` would leak the full callback URL as Referer
        # on same-origin navigations because frontend and API share one origin.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
        proxy_pass http://oss_hub_compose;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /api/v1/admin/collection/trigger {
        limit_req zone=admin_collection burst=1 nodelay;
        limit_req_status 429;
        proxy_pass http://oss_hub_compose;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /api/v1/admin/collection/discover-external {
        limit_req zone=admin_collection burst=1 nodelay;
        limit_req_status 429;
        proxy_pass http://oss_hub_compose;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 6m;
        proxy_pass http://oss_hub_compose;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        # 제출 파일 업로드가 이 경로를 지난다. nginx 기본값 1m 을 두면 Compose nginx 에 닿기도
        # 전에 1MB 초과 제출이 413 으로 죽는다. Compose 쪽 /api/ 와 같은 6m 로 맞춘다.
        client_max_body_size 6m;
        proxy_pass http://oss_hub_compose;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
