server_tokens off;
log_format query_safe '$remote_addr [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';
log_format oauth_callback_safe '$remote_addr [$time_local] '
                               '"$request_method $uri $server_protocol" $status $body_bytes_sent';

map $http_x_forwarded_proto $client_scheme {
    default $scheme;
    https https;
}

# This header is set only by the host origin boundary after its Basic auth.
map $http_x_vercel_forwarded_for $vercel_client_key {
    default $http_x_vercel_forwarded_for;
    "" "";
}
limit_req_zone $vercel_client_key zone=api:10m rate=10r/s;
limit_req_zone $vercel_client_key zone=oauth:10m rate=10r/m;
limit_req_zone $vercel_client_key zone=admin_collection:10m rate=2r/m;

server {
    listen 80 default_server;
    server_name _;
    return 404;
}

server {
    listen 80;
    server_name jnu-oss-hub.com localhost 127.0.0.1 [::1];

    access_log /var/log/nginx/access.log query_safe;
    proxy_hide_header X-Powered-By;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location = /api/v1/auth/github {
        if ($vercel_client_key = "") { return 403; }
        limit_except GET { deny all; }
        limit_req zone=oauth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Vercel-Forwarded-For "";
        proxy_set_header X-Origin-Rate-Key "";
        proxy_set_header X-RateLimit-Limit "";
        proxy_set_header X-RateLimit-Remaining "";
        proxy_set_header X-RateLimit-Reset "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $client_scheme;
    }

    location = /api/v1/auth/github/callback {
        if ($vercel_client_key = "") { return 403; }
        limit_except GET { deny all; }
        limit_req zone=oauth burst=5 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/access.log oauth_callback_safe;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Vercel-Forwarded-For "";
        proxy_set_header X-Origin-Rate-Key "";
        proxy_set_header X-RateLimit-Limit "";
        proxy_set_header X-RateLimit-Remaining "";
        proxy_set_header X-RateLimit-Reset "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $client_scheme;
    }

    location = /api/v1/admin/collection/trigger {
        if ($vercel_client_key = "") { return 403; }
        limit_except POST { deny all; }
        limit_req zone=admin_collection burst=1 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Vercel-Forwarded-For "";
        proxy_set_header X-Origin-Rate-Key "";
        proxy_set_header X-RateLimit-Limit "";
        proxy_set_header X-RateLimit-Remaining "";
        proxy_set_header X-RateLimit-Reset "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $client_scheme;
    }

    location = /api/v1/admin/collection/discover-external {
        if ($vercel_client_key = "") { return 403; }
        limit_except POST { deny all; }
        limit_req zone=admin_collection burst=1 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Vercel-Forwarded-For "";
        proxy_set_header X-Origin-Rate-Key "";
        proxy_set_header X-RateLimit-Limit "";
        proxy_set_header X-RateLimit-Remaining "";
        proxy_set_header X-RateLimit-Reset "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $client_scheme;
    }

    location /api/v1/ {
        if ($vercel_client_key = "") { return 403; }
        limit_except GET HEAD POST PATCH DELETE { deny all; }
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 6m;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Vercel-Forwarded-For "";
        proxy_set_header X-Origin-Rate-Key "";
        proxy_set_header X-RateLimit-Limit "";
        proxy_set_header X-RateLimit-Remaining "";
        proxy_set_header X-RateLimit-Reset "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $client_scheme;
    }

    location / {
        return 404;
    }
}
