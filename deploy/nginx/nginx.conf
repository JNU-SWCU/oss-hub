log_format query_safe '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';
log_format oauth_callback_safe '$remote_addr - $remote_user [$time_local] '
                               '"$request_method $uri $server_protocol" $status $body_bytes_sent';

# host TLS terminator가 전달한 https만 신뢰한다. Compose ingress는 127.0.0.1에만 bind된다.
map $http_x_forwarded_proto $client_scheme {
    default $scheme;
    https https;
}

server {
    access_log /var/log/nginx/access.log query_safe;
    listen 80;
    server_name _;

    location = /api/v1/auth/github/callback {
        access_log /var/log/nginx/access.log oauth_callback_safe;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        # proxy_pass에 URI를 붙이지 않아 callback 경로와 query를 backend에 그대로 전달한다.
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
    }

    # Off-host object backup 완료 전 제출 파일 업로드를 fail-closed로 차단한다.
    # exact path와 trailing-slash/subpath를 함께 막아 /api/ 프록시 우회를 막는다.
    # query string은 location 매칭 대상이 아니므로 별도 규칙 없이 동일 차단된다.
    location = /api/v1/submission-files {
        return 403;
    }
    location ^~ /api/v1/submission-files/ {
        return 403;
    }
    location /api/ {
        # proxy_pass에 URI를 붙이지 않아 /api/v1 접두어를 보존한다.
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
    }
}
